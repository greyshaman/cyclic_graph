[package]
name = "cyclic_graph"
version = "0.1.1"
edition = "2024"
authors = ["Sergey Reshetnikov <shaman@simmirra.com>"]
license = "MIT"
repository = "https://github.com/greyshaman/cyclic_graph"
homepage = "https://github.com/greyshaman/cyclic_graph"
keywords = ["graph", "algorithms", "storage"]
readme = "README.md"
description="""
This package provides a way to use a structure that implements
a cyclic directed graph with a single input and single output.
It is designed to be used asynchronously.
"""

[dependencies]
async-recursion = "1.1.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }

[build-dependencies]
cargo_metadata = "0.19.2"
